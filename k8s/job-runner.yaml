apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: sqa
  labels:
    app.kubernetes.io/name: automation-runner
    app.kubernetes.io/component: test-runner
    automation-runner/target: "__TARGET_LABEL__"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automation-runner
        app.kubernetes.io/component: test-runner
        automation-runner/job-name: "__JOB_NAME__"
    spec:
      restartPolicy: Never
      containers:
        - name: test-runner
          image: __RUNNER_IMAGE__
          imagePullPolicy: Always
          env:
            - name: ENVIRONMENT
              value: "__ENVIRONMENT__"
            - name: REGION
              value: "__REGION__"
            - name: SELECTED_SUITE
              value: "__SELECTED_SUITE__"
            - name: MOTIVE_TEST_REPORT_BUCKET
              value: "__REPORT_BUCKET__"
            - name: AWS_REGION
              value: "__AWS_REGION__"
          envFrom:
            - secretRef:
                name: automation-runner-secrets
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              export RUNNER_DIR="/opt/automation-runner"
              export FRAMEWORK_DIR="/opt/motive-testing-automationframework"
              export PROJECT_DIR="${FRAMEWORK_DIR}"
              export BASH_ENV="${FRAMEWORK_DIR}/.ci/ci-test-helper.sh"

              /opt/automation-runner/scripts/generate_framework_env.sh

              if [[ -n "${AWS_ACCESS_KEY_ID:-}" && -n "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
                download_test_framework_settings "${ENVIRONMENT}" "${REGION}"
              else
                echo "AWS credentials not configured; skipping download_test_framework_settings"
              fi

              cd /opt/automation-runner
              test_exit=0
              python3 runner.py "${ENVIRONMENT}" "${SELECTED_SUITE}" || test_exit=$?

              cd "${FRAMEWORK_DIR}"
              report_id="$(date +%s)"
              upload_intellij_xml_report "${report_id}" "api" || true
              upload_api_usage_log "${report_id}" || true
              generate_and_upload_allure_report "${report_id}" "api" || true

              exit "${test_exit}"
