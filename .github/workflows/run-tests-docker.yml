name: Automation Runner Docker
run-name: "automation-runner-docker-${{ github.event.inputs.environment || 'staging' }}-${{ github.event.inputs.run_mode == 'group' && github.event.inputs.suite_group || github.event.inputs.sub_package || github.event.inputs.pod || 'safety.settings' }}-${{ github.event.inputs.parallelization_level || 'suite' }}"

on:
  workflow_dispatch:
    inputs:
      image_branch:
        description: Branch that stores the latest Docker image tarball
        required: true
        default: docker-latest
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - preview
      region:
        description: Region used for framework settings download
        required: true
        default: us
        type: choice
        options:
          - us
          - eu
          - all
      run_mode:
        description: Run a single suite or a curated parallel group
        required: true
        default: single
        type: choice
        options:
          - single
          - group
      parallelization_level:
        description: Parallelize by suite or by discovered test class
        required: true
        default: suite
        type: choice
        options:
          - suite
          - class
      pod:
        description: Test pod to run
        required: true
        default: safety
        type: choice
        options:
          - assetGateway
          - assetTracking
          - ciam
          - coaching
          - collisionConfidenceTests
          - compliance
          - complianceTemporary
          - cxReports
          - dataGeneration
          - deviceExperience
          - dispatch
          - eld
          - enterprisePlatform
          - fleetFoundation
          - fleetapp
          - fleetcard
          - fuel
          - growth
          - internationalization
          - k2web
          - maintenance
          - platform
          - publicApi
          - reports
          - safety
          - safetyEmail
          - slb
          - telematics
          - wfm
          - workForceManagement
      sub_package:
        description: Sub-package (overrides pod for suite). Leave empty to run entire pod.
        required: false
        default: ''
        type: choice
        options:
          - ''
          - safety.settings
          - safety.safetyDriverApp
          - assetGateway.alerts.*
          - assetGateway.wifiUsage.*
          - assetTracking.vg5.*
          - coaching.coachingAssignments.*
          - coaching.driverDashboard.*
          - collisionConfidenceTests.VGOnlyTests.*
          - collisionConfidenceTests.existingCollisionAnnotationFlow.*
          - collisionConfidenceTests.liveFlowTests.*
          - collisionConfidenceTests.shadowModeTests.*
          - collisionConfidenceTests.trialModeTests.*
          - compliance.complianceVg5.*
          - complianceTemporary.log.*
          - enterprisePlatform.alerts.*
          - fleetFoundation.k2Web.*
          - fleetFoundation.profileId.*
          - fleetcard.experience.*
          - fleetcard.growth.*
          - fleetcard.integration.*
          - fleetcard.platform.*
          - fleetcard.revenueExpansion.*
          - fleetcard.risk.*
          - fuel.idlingEvents.*
          - fuel.overviewFuelRevamp.*
          - k2web.assetGateway.*
          - k2web.assetTracking.*
          - k2web.compliance.*
          - k2web.deviceExperience.*
          - k2web.enterprisePlatform.*
          - k2web.fleetapp.*
          - k2web.fuel.*
          - k2web.publicApi.*
          - maintenance.vg5.*
          - publicApi.AvailableTime.*
          - safety.annotationTool.*
          - safety.fmDashboard.*
          - safety.fmDashboard.cameras.*
          - safety.fmDashboard.drivers.*
          - safety.fmDashboard.events.*
          - safety.fmDashboard.overview.*
          - safety.fmDashboard.requests.*
          - safety.notificationCenter.*
          - safety.publicApi.*
          - safety.reports.*
          - safety.safetyDriverApp.*
          - safety.settings.*
          - safety.speeding.*
          - safety.vg3.*
          - safety.vg5.*
          - safety.vg5events.*
          - safetyEmail.dc54.*
          - safetyEmail.oc.*
          - slb.bulk.*
          - slb.carriers.*
          - slb.initConfig.*
          - slb.offers.*
          - slb.search.*
          - slb.submitOffer.*
          - slb.suggestedLoads.*
      suite_group:
        description: Curated suite group to run in parallel when run_mode=group
        required: false
        default: safety-smoke
        type: choice
        options:
          - safety-smoke
          - safety-core
          - safety-driver-subset

permissions:
  contents: read

jobs:
  resolve-image-metadata:
    runs-on: ubuntu-latest
    outputs:
      framework_ref: ${{ steps.meta.outputs.framework_ref }}
      source_branch: ${{ steps.meta.outputs.source_branch }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout artifact branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.image_branch || 'docker-latest' }}
          path: image-artifact

      - id: meta
        name: Read image manifest
        run: |
          manifest="image-artifact/manifest.json"
          if [[ ! -f "${manifest}" ]]; then
            echo "Expected manifest not found in artifact branch: ${manifest}"
            exit 1
          fi
          framework_ref=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["framework_ref"])' "${manifest}")
          source_branch=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_branch"])' "${manifest}")
          image_tag=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_tag"])' "${manifest}")
          echo "framework_ref=${framework_ref}" >> "$GITHUB_OUTPUT"
          echo "source_branch=${source_branch}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

  resolve-suites:
    runs-on: ubuntu-latest
    needs: resolve-image-metadata
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      selection_label: ${{ steps.select.outputs.selection_label }}
    steps:
      - name: Checkout Framework Repo
        uses: actions/checkout@v5
        with:
          repository: KeepTruckin/motive-testing-automationframework
          token: ${{ secrets.GH_PAT }}
          ref: ${{ needs.resolve-image-metadata.outputs.framework_ref }}
          path: framework

      - name: Checkout Runner (This Repo)
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-image-metadata.outputs.source_branch }}
          path: runner-code

      - id: select
        name: Resolve selected suites
        run: |
          resolved=$(python3 runner-code/scripts/resolve_test_targets.py \
            "${{ github.event.inputs.run_mode || 'single' }}" \
            "${{ github.event.inputs.suite_group || 'safety-smoke' }}" \
            "${{ github.event.inputs.pod || 'safety' }}" \
            "${{ github.event.inputs.sub_package || '' }}" \
            "${{ github.event.inputs.parallelization_level || 'suite' }}" \
            "$GITHUB_WORKSPACE/framework")
          echo "$resolved"
          selection_label=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["selection_label"])' "$resolved")
          matrix=$(python3 -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["matrix"]))' "$resolved")
          echo "selection_label=${selection_label}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  test:
    needs:
      - resolve-image-metadata
      - resolve-suites
    name: "${{ matrix.label }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.resolve-suites.outputs.matrix) }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
      TARGET_SUITE: ${{ matrix.target }}
      REGION: ${{ github.event.inputs.region || 'us' }}
      MOTIVE_TEST_REPORT_BUCKET: motive-automated-test-report
      AWS_REGION: us-east-1
      RUNNER_IMAGE: automation-runner:${{ needs.resolve-image-metadata.outputs.image_tag }}

    steps:
      - name: Checkout artifact branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.image_branch || 'docker-latest' }}
          path: image-artifact

      - name: Load Docker image tarball
        run: |
          image_tar="image-artifact/automation-runner-image.tar.gz"
          if [[ ! -f "${image_tar}" ]]; then
            echo "Expected image tarball not found: ${image_tar}"
            exit 1
          fi
          docker load -i "${image_tar}"

      - name: Run test inside Docker image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          MOTIVE_ADMIN_EMAIL: ${{ secrets.MOTIVE_ADMIN_EMAIL }}
          MOTIVE_ADMIN_PASSWORD: ${{ secrets.MOTIVE_ADMIN_PASSWORD }}
          MOTIVE_WEBUSERNAMEPASSWORD: ${{ secrets.MOTIVE_WEBUSERNAMEPASSWORD }}
          MOTIVE_DRIVER_EMAIL: ${{ secrets.MOTIVE_DRIVER_EMAIL }}
          MOTIVE_DRIVER_PASSWORD: ${{ secrets.MOTIVE_DRIVER_PASSWORD }}
          MOTIVE_ADMIN_CONSOLE_EMAIL: ${{ secrets.MOTIVE_ADMIN_CONSOLE_EMAIL }}
          MOTIVE_ADMIN_CONSOLE_PASSWORD: ${{ secrets.MOTIVE_ADMIN_CONSOLE_PASSWORD }}
          MOTIVE_ELDAPIKEY_STAGING: ${{ secrets.MOTIVE_ELDAPIKEY_STAGING }}
          MOTIVE_MOBILEAPIAUTHORIZATIONKEY: ${{ secrets.MOTIVE_MOBILEAPIAUTHORIZATIONKEY }}
          MOTIVE_TESTING_API_KEY_STAGING: ${{ secrets.MOTIVE_TESTING_API_KEY_STAGING }}
          MOTIVE_INTERNAL_API_KEY_STAGING: ${{ secrets.MOTIVE_INTERNAL_API_KEY_STAGING }}
          MOTIVE_AI_DRIVER_EMAIL_ID: ${{ secrets.MOTIVE_AI_DRIVER_EMAIL_ID }}
          MOTIVE_AI_DRIVER_PASSWORD: ${{ secrets.MOTIVE_AI_DRIVER_PASSWORD }}
          MOTIVE_AI_VEHICLE_ID: ${{ secrets.MOTIVE_AI_VEHICLE_ID }}
          MOTIVE_AI_ELD_DEVICE_ID: ${{ secrets.MOTIVE_AI_ELD_DEVICE_ID }}
          MOTIVE_AI_ELD_IDENTIFIER: ${{ secrets.MOTIVE_AI_ELD_IDENTIFIER }}
          MOTIVE_CAMERA_SERIALNUMBER: ${{ secrets.MOTIVE_CAMERA_SERIALNUMBER }}
          MOTIVE_SAFETY1_VEHICLE_ID: ${{ secrets.MOTIVE_SAFETY1_VEHICLE_ID }}
          MOTIVE_SAFETY1_DRIVER_ID: ${{ secrets.MOTIVE_SAFETY1_DRIVER_ID }}
          MOTIVE_SAFETY1_DRIVER_EMAIL: ${{ secrets.MOTIVE_SAFETY1_DRIVER_EMAIL }}
          MOTIVE_SAFETY1_DRIVER_PASSWORD: ${{ secrets.MOTIVE_SAFETY1_DRIVER_PASSWORD }}
          MOTIVE_SAFETY2_VEHICLE_ID: ${{ secrets.MOTIVE_SAFETY2_VEHICLE_ID }}
          MOTIVE_SAFETY2_ELD_DEVICE_ID: ${{ secrets.MOTIVE_SAFETY2_ELD_DEVICE_ID }}
          MOTIVE_SAFETY2_ELD_IDENTIFIER: ${{ secrets.MOTIVE_SAFETY2_ELD_IDENTIFIER }}
          MOTIVE_SAFETY2_DRIVER_ID: ${{ secrets.MOTIVE_SAFETY2_DRIVER_ID }}
          MOTIVE_SAFETY2_DRIVER_EMAIL_ID: ${{ secrets.MOTIVE_SAFETY2_DRIVER_EMAIL_ID }}
          MOTIVE_SAFETY2_DRIVER_PASSWORD: ${{ secrets.MOTIVE_SAFETY2_DRIVER_PASSWORD }}
        run: |
          tmp_env_file="$(mktemp)"
          trap 'rm -f "${tmp_env_file}"' EXIT
          env | sort | awk -F= '
            /^(AWS_|MOTIVE_|motive_|FC_|MARQETA_|TWILIO_|VRT_|COMMENT=|API_TOKEN=|SLACK_WEBHOOK_URL=|ENVIRONMENT=|REGION=|TARGET_SUITE=|MOTIVE_TEST_REPORT_BUCKET=)/ {
              print
            }
          ' > "${tmp_env_file}"

          docker run --rm \
            --env-file "${tmp_env_file}" \
            "${RUNNER_IMAGE}" \
            bash -lc '
              set -euo pipefail
              export RUNNER_DIR="/opt/automation-runner"
              export FRAMEWORK_DIR="/opt/motive-testing-automationframework"
              export PROJECT_DIR="${FRAMEWORK_DIR}"
              export BASH_ENV="${FRAMEWORK_DIR}/.ci/ci-test-helper.sh"
              source "${BASH_ENV}"
              /opt/automation-runner/scripts/generate_framework_env.sh
              if [[ -n "${AWS_ACCESS_KEY_ID:-}" && -n "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
                download_test_framework_settings "${ENVIRONMENT}" "${REGION}"
              fi
              test_exit=0
              cd /opt/automation-runner
              python3 runner.py "${ENVIRONMENT}" "${TARGET_SUITE}" || test_exit=$?
              cd "${FRAMEWORK_DIR}"
              report_id=$(date +%s)
              upload_intellij_xml_report "${report_id}" "api" || true
              upload_api_usage_log "${report_id}" || true
              generate_and_upload_allure_report "${report_id}" "api" || true
              exit "${test_exit}"
            '
