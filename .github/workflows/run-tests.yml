name: Automation Runner

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
      suite:
        description: Framework suite token passed to .ci/run-api-tests-by-pod.sh
        required: true
        default: safety.settings
  push:
    branches: [ main, automation_runner ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KT Repo
        uses: actions/checkout@v4
        with:
          repository: KeepTruckin/kt
          token: ${{ secrets.GH_PAT }}
          sparse-checkout: |
            .ci
            .gitmodules
            etc
            lib
            src/qa-sqa/automation-framework
          sparse-checkout-cone-mode: false

      - name: Checkout Runner (This Repo)
        uses: actions/checkout@v4
        with:
          path: runner-code

      - name: Configure GitHub Auth For Submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "ssh://git@github.com/"
          git config -f .gitmodules submodule.src/qa-sqa/automation-framework.url "https://x-access-token:${{ secrets.GH_PAT }}@github.com/KeepTruckin/motive-testing-automationframework.git"
          git config submodule.src/qa-sqa/automation-framework.url "https://x-access-token:${{ secrets.GH_PAT }}@github.com/KeepTruckin/motive-testing-automationframework.git"
          git submodule sync -- src/qa-sqa/automation-framework

      - name: Init Framework Submodule
        run: git submodule update --init --recursive src/qa-sqa/automation-framework

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Framework Scripts Executable
        run: |
          chmod +x ${{ github.workspace }}/.ci/prod/runner.sh
          chmod +x ${{ github.workspace }}/src/qa-sqa/automation-framework/gradlew
          chmod +x ${{ github.workspace }}/src/qa-sqa/automation-framework/.ci/run-api-tests-by-pod.sh

      - name: Link CI Helpers For GitHub Runner Layout
        run: |
          mkdir -p /Users/runner/.ci
          ln -sfn ${{ github.workspace }}/.ci/corp /Users/runner/.ci/corp

      - name: Debug Runner Layout
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          pwd
          ls -la /Users/runner/.ci || true
          ls -la /Users/runner/.ci/corp || true
          ls -la ${{ github.workspace }}/.ci || true
          ls -la ${{ github.workspace }}/.ci/corp || true
          ls -la ${{ github.workspace }}/src/qa-sqa/automation-framework/.ci || true

      - name: Install dependencies
        run: |
          cd runner-code
          pip install -r requirements.txt

      - name: Run automation runner
        run: |
          cd runner-code
          python runner.py "${{ github.event.inputs.environment || 'staging' }}" "${{ github.event.inputs.suite || 'safety.settings' }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROJECT_DIR: ${{ github.workspace }}
