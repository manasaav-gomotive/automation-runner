name: Automation Runner

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
      region:
        description: Region used for framework settings download
        required: true
        default: us
      suite:
        description: Gradle test class or pattern passed to --tests
        required: true
        default: SafetySettings
  push:
    branches: [ main, automation_runner ]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      HAS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      HAS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Framework Repo
        uses: actions/checkout@v5
        with:
          repository: KeepTruckin/motive-testing-automationframework
          token: ${{ secrets.GH_PAT }}
          path: framework

      - name: Checkout Runner (This Repo)
        uses: actions/checkout@v5
        with:
          path: runner-code

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure AWS credentials
        if: ${{ env.HAS_AWS_ACCESS_KEY_ID != '' && env.HAS_AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Prepare framework environment
        run: |
          echo "BASH_ENV=$GITHUB_WORKSPACE/framework/.ci/ci-test-helper.sh" >> "$GITHUB_ENV"
          source framework/.ci/ci-test-helper.sh
          if [[ -n "${HAS_AWS_ACCESS_KEY_ID}" && -n "${HAS_AWS_SECRET_ACCESS_KEY}" ]]; then
            download_test_framework_settings "${{ github.event.inputs.environment || 'staging' }}" "${{ github.event.inputs.region || 'us' }}"
          else
            echo "AWS credentials not configured in this repo; skipping download_test_framework_settings"
          fi

      - name: Debug downloaded framework settings
        run: |
          settings_file="framework/gomotive-automation-framework/core/src/main/resources/testFrameworkSettings.${{ github.event.inputs.environment || 'staging' }}.json"
          echo "Searching for framework settings files"
          find framework \( -name '*.properties' -o -name '*.json' -o -name '*.yaml' -o -name '*.yml' \) | sort | sed -n '1,120p'
          echo "Inspecting ${settings_file}"
          if [[ -f "${settings_file}" ]]; then
            grep -nE "env_motive_ai_eld_identifier|env_motive_safety1_vehicle_id|motive_ai_eld_identifier|motive_safety1_vehicle_id" "${settings_file}" || true
          else
            echo "Settings file not found during debug: ${settings_file}"
          fi

      - name: Validate downloaded framework settings
        run: |
          settings_file="framework/gomotive-automation-framework/core/src/main/resources/testFrameworkSettings.${{ github.event.inputs.environment || 'staging' }}.json"
          if [[ ! -f "${settings_file}" ]]; then
            echo "Expected framework settings file not found: ${settings_file}"
            echo "This usually means download_test_framework_settings did not run or could not access AWS Secrets Manager."
            exit 1
          fi
          echo "Found settings file: ${settings_file}"

      - name: Generate framework .env
        env:
          MOTIVE_ADMIN_EMAIL: ${{ secrets.MOTIVE_ADMIN_EMAIL }}
          MOTIVE_ADMIN_PASSWORD: ${{ secrets.MOTIVE_ADMIN_PASSWORD }}
          MOTIVE_WEBUSERNAMEPASSWORD: ${{ secrets.MOTIVE_WEBUSERNAMEPASSWORD }}
          MOTIVE_DRIVER_EMAIL: ${{ secrets.MOTIVE_DRIVER_EMAIL }}
          MOTIVE_DRIVER_PASSWORD: ${{ secrets.MOTIVE_DRIVER_PASSWORD }}
          MOTIVE_ADMIN_CONSOLE_EMAIL: ${{ secrets.MOTIVE_ADMIN_CONSOLE_EMAIL }}
          MOTIVE_ADMIN_CONSOLE_PASSWORD: ${{ secrets.MOTIVE_ADMIN_CONSOLE_PASSWORD }}
          MOTIVE_MOBILEAPIAUTHORIZATIONKEY: ${{ secrets.MOTIVE_MOBILEAPIAUTHORIZATIONKEY }}
          MOTIVE_TESTING_API_KEY_STAGING: ${{ secrets.MOTIVE_TESTING_API_KEY_STAGING }}
          MOTIVE_INTERNAL_API_KEY_STAGING: ${{ secrets.MOTIVE_INTERNAL_API_KEY_STAGING }}
          MOTIVE_AI_DRIVER_EMAIL_ID: ${{ secrets.MOTIVE_AI_DRIVER_EMAIL_ID }}
          MOTIVE_AI_DRIVER_PASSWORD: ${{ secrets.MOTIVE_AI_DRIVER_PASSWORD }}
          MOTIVE_AI_VEHICLE_ID: ${{ secrets.MOTIVE_AI_VEHICLE_ID }}
          MOTIVE_AI_ELD_DEVICE_ID: ${{ secrets.MOTIVE_AI_ELD_DEVICE_ID }}
          MOTIVE_AI_ELD_IDENTIFIER: ${{ secrets.MOTIVE_AI_ELD_IDENTIFIER }}
          MOTIVE_CAMERA_SERIALNUMBER: ${{ secrets.MOTIVE_CAMERA_SERIALNUMBER }}
          MOTIVE_SAFETY1_VEHICLE_ID: ${{ secrets.MOTIVE_SAFETY1_VEHICLE_ID }}
          MOTIVE_SAFETY1_DRIVER_ID: ${{ secrets.MOTIVE_SAFETY1_DRIVER_ID }}
          MOTIVE_SAFETY1_DRIVER_EMAIL: ${{ secrets.MOTIVE_SAFETY1_DRIVER_EMAIL }}
          MOTIVE_SAFETY1_DRIVER_PASSWORD: ${{ secrets.MOTIVE_SAFETY1_DRIVER_PASSWORD }}
        run: |
          env_file="framework/gomotive-automation-framework/core/src/main/resources/.env"
          cat > "${env_file}" <<EOF
          MOTIVE_ADMIN_EMAIL=${MOTIVE_ADMIN_EMAIL}
          MOTIVE_ADMIN_PASSWORD=${MOTIVE_ADMIN_PASSWORD}
          MOTIVE_WEBUSERNAMEPASSWORD=${MOTIVE_WEBUSERNAMEPASSWORD}
          MOTIVE_DRIVER_EMAIL=${MOTIVE_DRIVER_EMAIL}
          MOTIVE_DRIVER_PASSWORD=${MOTIVE_DRIVER_PASSWORD}
          MOTIVE_ADMIN_CONSOLE_EMAIL=${MOTIVE_ADMIN_CONSOLE_EMAIL}
          MOTIVE_ADMIN_CONSOLE_PASSWORD=${MOTIVE_ADMIN_CONSOLE_PASSWORD}
          MOTIVE_MOBILEAPIAUTHORIZATIONKEY=${MOTIVE_MOBILEAPIAUTHORIZATIONKEY}
          MOTIVE_TESTING_API_KEY_STAGING=${MOTIVE_TESTING_API_KEY_STAGING}
          MOTIVE_TESTING_API_KEY=${MOTIVE_TESTING_API_KEY_STAGING}
          MOTIVE_INTERNAL_API_KEY_STAGING=${MOTIVE_INTERNAL_API_KEY_STAGING}
          MOTIVE_INTERNAL_API_KEY=${MOTIVE_INTERNAL_API_KEY_STAGING}
          MOTIVE_AI_DRIVER_EMAIL_ID=${MOTIVE_AI_DRIVER_EMAIL_ID}
          MOTIVE_AI_DRIVER_PASSWORD=${MOTIVE_AI_DRIVER_PASSWORD}
          MOTIVE_AI_VEHICLE_ID=${MOTIVE_AI_VEHICLE_ID}
          MOTIVE_AI_ELD_DEVICE_ID=${MOTIVE_AI_ELD_DEVICE_ID}
          MOTIVE_AI_ELD_IDENTIFIER=${MOTIVE_AI_ELD_IDENTIFIER}
          MOTIVE_CAMERA_SERIALNUMBER=${MOTIVE_CAMERA_SERIALNUMBER}
          MOTIVE_SAFETY1_VEHICLE_ID=${MOTIVE_SAFETY1_VEHICLE_ID}
          MOTIVE_SAFETY1_DRIVER_ID=${MOTIVE_SAFETY1_DRIVER_ID}
          MOTIVE_SAFETY1_DRIVER_EMAIL=${MOTIVE_SAFETY1_DRIVER_EMAIL}
          MOTIVE_SAFETY1_DRIVER_PASSWORD=${MOTIVE_SAFETY1_DRIVER_PASSWORD}
          motive_admin_email=${MOTIVE_ADMIN_EMAIL}
          motive_admin_password=${MOTIVE_ADMIN_PASSWORD}
          motive_webusernamepassword=${MOTIVE_WEBUSERNAMEPASSWORD}
          motive_driver_email=${MOTIVE_DRIVER_EMAIL}
          motive_driver_password=${MOTIVE_DRIVER_PASSWORD}
          motive_admin_console_email=${MOTIVE_ADMIN_CONSOLE_EMAIL}
          motive_admin_console_password=${MOTIVE_ADMIN_CONSOLE_PASSWORD}
          motive_mobileapiauthorizationkey=${MOTIVE_MOBILEAPIAUTHORIZATIONKEY}
          motive_testing_api_key_staging=${MOTIVE_TESTING_API_KEY_STAGING}
          motive_testing_api_key=${MOTIVE_TESTING_API_KEY_STAGING}
          motive_internal_api_key_staging=${MOTIVE_INTERNAL_API_KEY_STAGING}
          motive_internal_api_key=${MOTIVE_INTERNAL_API_KEY_STAGING}
          motive_ai_driver_email_id=${MOTIVE_AI_DRIVER_EMAIL_ID}
          motive_ai_driver_password=${MOTIVE_AI_DRIVER_PASSWORD}
          motive_ai_vehicle_id=${MOTIVE_AI_VEHICLE_ID}
          motive_ai_eld_device_id=${MOTIVE_AI_ELD_DEVICE_ID}
          motive_ai_eld_identifier=${MOTIVE_AI_ELD_IDENTIFIER}
          motive_camera_serialnumber=${MOTIVE_CAMERA_SERIALNUMBER}
          motive_safety1_vehicle_id=${MOTIVE_SAFETY1_VEHICLE_ID}
          motive_safety1_driver_id=${MOTIVE_SAFETY1_DRIVER_ID}
          motive_safety1_driver_email=${MOTIVE_SAFETY1_DRIVER_EMAIL}
          motive_safety1_driver_password=${MOTIVE_SAFETY1_DRIVER_PASSWORD}
          EOF
          echo "Generated ${env_file}"

      - name: Validate required framework env values
        env:
          MOTIVE_ADMIN_EMAIL: ${{ secrets.MOTIVE_ADMIN_EMAIL }}
          MOTIVE_ADMIN_PASSWORD: ${{ secrets.MOTIVE_ADMIN_PASSWORD }}
          MOTIVE_WEBUSERNAMEPASSWORD: ${{ secrets.MOTIVE_WEBUSERNAMEPASSWORD }}
          MOTIVE_MOBILEAPIAUTHORIZATIONKEY: ${{ secrets.MOTIVE_MOBILEAPIAUTHORIZATIONKEY }}
          MOTIVE_TESTING_API_KEY_STAGING: ${{ secrets.MOTIVE_TESTING_API_KEY_STAGING }}
          MOTIVE_INTERNAL_API_KEY_STAGING: ${{ secrets.MOTIVE_INTERNAL_API_KEY_STAGING }}
          MOTIVE_AI_ELD_IDENTIFIER: ${{ secrets.MOTIVE_AI_ELD_IDENTIFIER }}
          MOTIVE_SAFETY1_VEHICLE_ID: ${{ secrets.MOTIVE_SAFETY1_VEHICLE_ID }}
        run: |
          missing=0
          if [[ -z "${MOTIVE_ADMIN_EMAIL}" ]]; then
            echo "Missing required secret: MOTIVE_ADMIN_EMAIL"
            missing=1
          fi
          if [[ -z "${MOTIVE_ADMIN_PASSWORD}" ]]; then
            echo "Missing required secret: MOTIVE_ADMIN_PASSWORD"
            missing=1
          fi
          if [[ -z "${MOTIVE_WEBUSERNAMEPASSWORD}" ]]; then
            echo "Missing required secret: MOTIVE_WEBUSERNAMEPASSWORD"
            missing=1
          fi
          if [[ -z "${MOTIVE_MOBILEAPIAUTHORIZATIONKEY}" ]]; then
            echo "Missing required secret: MOTIVE_MOBILEAPIAUTHORIZATIONKEY"
            missing=1
          fi
          if [[ -z "${MOTIVE_TESTING_API_KEY_STAGING}" ]]; then
            echo "Missing required secret: MOTIVE_TESTING_API_KEY_STAGING"
            missing=1
          fi
          if [[ -z "${MOTIVE_INTERNAL_API_KEY_STAGING}" ]]; then
            echo "Missing required secret: MOTIVE_INTERNAL_API_KEY_STAGING"
            missing=1
          fi
          if [[ -z "${MOTIVE_AI_ELD_IDENTIFIER}" ]]; then
            echo "Missing required secret: MOTIVE_AI_ELD_IDENTIFIER"
            missing=1
          fi
          if [[ -z "${MOTIVE_SAFETY1_VEHICLE_ID}" ]]; then
            echo "Missing required secret: MOTIVE_SAFETY1_VEHICLE_ID"
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            echo "Framework suite cannot run until the required secrets are configured in this repo/environment."
            exit 1
          fi

      - name: Install SDKMAN and project env
        run: |
          cd framework
          install_sdkman_env

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Framework Scripts Executable
        run: |
          chmod +x ${{ github.workspace }}/framework/gradlew

      - name: Install dependencies
        run: |
          cd runner-code
          pip install -r requirements.txt

      - name: Run automation runner
        run: |
          cd runner-code
          python runner.py "${{ github.event.inputs.environment || 'staging' }}" "${{ github.event.inputs.suite || 'safety.settings' }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          AWS_REGION: us-east-1
          PROJECT_DIR: ${{ github.workspace }}/framework
