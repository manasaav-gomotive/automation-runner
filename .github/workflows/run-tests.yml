name: Automation Runner
run-name: "automation-runner-${{ github.event.inputs.environment || 'staging' }}-${{ github.event.inputs.run_mode == 'group' && github.event.inputs.suite_group || github.event.inputs.sub_package || github.event.inputs.pod || 'safety.settings' }}-${{ github.event.inputs.parallelization_level || 'suite' }}"

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      branch:
        description: Branch or ref to run tests from
        required: true
        default: master
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - preview
      region:
        description: Region used for framework settings download
        required: true
        default: us
        type: choice
        options:
          - us
          - eu
          - all
      run_mode:
        description: Run a single suite or a curated parallel group
        required: true
        default: single
        type: choice
        options:
          - single
          - group
      parallelization_level:
        description: Parallelize by suite or by discovered test class
        required: true
        default: suite
        type: choice
        options:
          - suite
          - class
      execution_runtime:
        description: Run directly on the GitHub runner or inside the shared Docker image
        required: true
        default: host
        type: choice
        options:
          - host
          - docker
      pod:
        description: Test pod to run
        required: true
        default: safety
        type: choice
        options:
          - assetGateway
          - assetTracking
          - ciam
          - coaching
          - collisionConfidenceTests
          - compliance
          - complianceTemporary
          - cxReports
          - dataGeneration
          - deviceExperience
          - dispatch
          - eld
          - enterprisePlatform
          - fleetFoundation
          - fleetapp
          - fleetcard
          - fuel
          - growth
          - internationalization
          - k2web
          - maintenance
          - platform
          - publicApi
          - reports
          - safety
          - safetyEmail
          - slb
          - telematics
          - wfm
          - workForceManagement
      sub_package:
        description: Sub-package (overrides pod for suite). Leave empty to run entire pod.
        required: false
        default: ''
        type: choice
        options:
          - ''
          - safety.settings
          - safety.safetyDriverApp
          - assetGateway.alerts.*
          - assetGateway.wifiUsage.*
          - assetTracking.vg5.*
          - coaching.coachingAssignments.*
          - coaching.driverDashboard.*
          - collisionConfidenceTests.VGOnlyTests.*
          - collisionConfidenceTests.existingCollisionAnnotationFlow.*
          - collisionConfidenceTests.liveFlowTests.*
          - collisionConfidenceTests.shadowModeTests.*
          - collisionConfidenceTests.trialModeTests.*
          - compliance.complianceVg5.*
          - complianceTemporary.log.*
          - enterprisePlatform.alerts.*
          - fleetFoundation.k2Web.*
          - fleetFoundation.profileId.*
          - fleetcard.experience.*
          - fleetcard.growth.*
          - fleetcard.integration.*
          - fleetcard.platform.*
          - fleetcard.revenueExpansion.*
          - fleetcard.risk.*
          - fuel.idlingEvents.*
          - fuel.overviewFuelRevamp.*
          - k2web.assetGateway.*
          - k2web.assetTracking.*
          - k2web.compliance.*
          - k2web.deviceExperience.*
          - k2web.enterprisePlatform.*
          - k2web.fleetapp.*
          - k2web.fuel.*
          - k2web.publicApi.*
          - maintenance.vg5.*
          - publicApi.AvailableTime.*
          - safety.annotationTool.*
          - safety.fmDashboard.*
          - safety.fmDashboard.cameras.*
          - safety.fmDashboard.drivers.*
          - safety.fmDashboard.events.*
          - safety.fmDashboard.overview.*
          - safety.fmDashboard.requests.*
          - safety.notificationCenter.*
          - safety.publicApi.*
          - safety.reports.*
          - safety.safetyDriverApp.*
          - safety.settings.*
          - safety.speeding.*
          - safety.vg3.*
          - safety.vg5.*
          - safety.vg5events.*
          - safetyEmail.dc54.*
          - safetyEmail.oc.*
          - slb.bulk.*
          - slb.carriers.*
          - slb.initConfig.*
          - slb.offers.*
          - slb.search.*
          - slb.submitOffer.*
          - slb.suggestedLoads.*
      suite_group:
        description: Curated suite group to run in parallel when run_mode=group
        required: false
        default: safety-smoke
        type: choice
        options:
          - safety-smoke
          - safety-core
          - safety-driver-subset
jobs:
  resolve-suites:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      selection_label: ${{ steps.select.outputs.selection_label }}
    steps:
      - name: Checkout Framework Repo
        uses: actions/checkout@v5
        with:
          repository: KeepTruckin/motive-testing-automationframework
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event.inputs.branch || 'master' }}
          path: framework

      - name: Checkout Runner (This Repo)
        uses: actions/checkout@v5
        with:
          path: runner-code

      - id: select
        name: Resolve selected suites
        run: |
          resolved=$(python3 runner-code/scripts/resolve_test_targets.py \
            "${{ github.event.inputs.run_mode || 'single' }}" \
            "${{ github.event.inputs.suite_group || 'safety-smoke' }}" \
            "${{ github.event.inputs.pod || 'safety' }}" \
            "${{ github.event.inputs.sub_package || '' }}" \
            "${{ github.event.inputs.parallelization_level || 'suite' }}" \
            "$GITHUB_WORKSPACE/framework")
          echo "$resolved"
          selection_label=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["selection_label"])' "$resolved")
          matrix=$(python3 -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1])["matrix"]))' "$resolved")
          echo "selection_label=${selection_label}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build-runtime-image:
    needs: resolve-suites
    if: ${{ github.event.inputs.execution_runtime == 'docker' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Runner (This Repo)
        uses: actions/checkout@v5

      - name: Build test-runner image
        run: |
          docker build \
            --build-arg GH_PAT="${{ secrets.GH_PAT }}" \
            --build-arg FRAMEWORK_REF="${{ github.event.inputs.branch || 'master' }}" \
            -t automation-runner:test-runtime .

      - name: Save test-runner image
        run: docker save automation-runner:test-runtime -o /tmp/automation-runner-test-runtime.tar

      - name: Upload test-runner image
        uses: actions/upload-artifact@v4
        with:
          name: automation-runner-test-runtime
          path: /tmp/automation-runner-test-runtime.tar
          retention-days: 1

  test:
    needs:
      - resolve-suites
      - build-runtime-image
    if: ${{ always() && needs.resolve-suites.result == 'success' && (needs.build-runtime-image.result == 'success' || needs.build-runtime-image.result == 'skipped') }}
    name: "${{ matrix.label }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.resolve-suites.outputs.matrix) }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
      SELECTED_SUITE: ${{ matrix.target }}
      TEST_POD: ${{ matrix.label }}
      PROJECT: api-system-tests
      FILTER_ARG: ${{ matrix.target }}
      MOTIVE_TEST_REPORT_BUCKET: motive-automated-test-report
      REGION: ${{ github.event.inputs.region || 'us' }}
      AWS_REGION: us-east-1
      HAS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      HAS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      EXECUTION_RUNTIME: ${{ github.event.inputs.execution_runtime || 'host' }}

    steps:
      - name: Checkout Framework Repo
        uses: actions/checkout@v5
        with:
          repository: KeepTruckin/motive-testing-automationframework
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event.inputs.branch || 'master' }}
          path: framework

      - name: Checkout Runner (This Repo)
        uses: actions/checkout@v5
        with:
          path: runner-code

      - name: Download test-runner image
        if: ${{ env.EXECUTION_RUNTIME == 'docker' }}
        uses: actions/download-artifact@v4
        with:
          name: automation-runner-test-runtime
          path: /tmp

      - name: Load test-runner image
        if: ${{ env.EXECUTION_RUNTIME == 'docker' }}
        run: docker load -i /tmp/automation-runner-test-runtime.tar

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure AWS credentials
        if: ${{ env.HAS_AWS_ACCESS_KEY_ID != '' && env.HAS_AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Prepare framework environment
        run: |
          echo "BASH_ENV=$GITHUB_WORKSPACE/framework/.ci/ci-test-helper.sh" >> "$GITHUB_ENV"
          source framework/.ci/ci-test-helper.sh
          if [[ -n "${HAS_AWS_ACCESS_KEY_ID}" && -n "${HAS_AWS_SECRET_ACCESS_KEY}" ]]; then
            download_test_framework_settings "${{ github.event.inputs.environment || 'staging' }}" "${{ github.event.inputs.region || 'us' }}"
          else
            echo "AWS credentials not configured in this repo; skipping download_test_framework_settings"
          fi

      - name: Debug downloaded framework settings
        run: |
          settings_file="framework/gomotive-automation-framework/core/src/main/resources/testFrameworkSettings.${{ github.event.inputs.environment || 'staging' }}.json"
          echo "Searching for framework settings files"
          find framework \( -name '*.properties' -o -name '*.json' -o -name '*.yaml' -o -name '*.yml' \) | sort | sed -n '1,120p'
          echo "Inspecting ${settings_file}"
          if [[ -f "${settings_file}" ]]; then
            grep -nE "env_motive_ai_eld_identifier|env_motive_safety1_vehicle_id|motive_ai_eld_identifier|motive_safety1_vehicle_id" "${settings_file}" || true
          else
            echo "Settings file not found during debug: ${settings_file}"
          fi

      - name: Validate downloaded framework settings
        run: |
          settings_file="framework/gomotive-automation-framework/core/src/main/resources/testFrameworkSettings.${{ github.event.inputs.environment || 'staging' }}.json"
          if [[ ! -f "${settings_file}" ]]; then
            echo "Expected framework settings file not found: ${settings_file}"
            echo "This usually means download_test_framework_settings did not run or could not access AWS Secrets Manager."
            exit 1
          fi
          echo "Found settings file: ${settings_file}"

      - name: Generate framework .env
        env:
          MOTIVE_ADMIN_EMAIL: ${{ secrets.MOTIVE_ADMIN_EMAIL }}
          MOTIVE_ADMIN_PASSWORD: ${{ secrets.MOTIVE_ADMIN_PASSWORD }}
          MOTIVE_WEBUSERNAMEPASSWORD: ${{ secrets.MOTIVE_WEBUSERNAMEPASSWORD }}
          MOTIVE_DRIVER_EMAIL: ${{ secrets.MOTIVE_DRIVER_EMAIL }}
          MOTIVE_DRIVER_PASSWORD: ${{ secrets.MOTIVE_DRIVER_PASSWORD }}
          MOTIVE_ADMIN_CONSOLE_EMAIL: ${{ secrets.MOTIVE_ADMIN_CONSOLE_EMAIL }}
          MOTIVE_ADMIN_CONSOLE_PASSWORD: ${{ secrets.MOTIVE_ADMIN_CONSOLE_PASSWORD }}
          MOTIVE_ELDAPIKEY_STAGING: ${{ secrets.MOTIVE_ELDAPIKEY_STAGING }}
          MOTIVE_MOBILEAPIAUTHORIZATIONKEY: ${{ secrets.MOTIVE_MOBILEAPIAUTHORIZATIONKEY }}
          MOTIVE_TESTING_API_KEY_STAGING: ${{ secrets.MOTIVE_TESTING_API_KEY_STAGING }}
          MOTIVE_INTERNAL_API_KEY_STAGING: ${{ secrets.MOTIVE_INTERNAL_API_KEY_STAGING }}
          MOTIVE_AI_DRIVER_EMAIL_ID: ${{ secrets.MOTIVE_AI_DRIVER_EMAIL_ID }}
          MOTIVE_AI_DRIVER_PASSWORD: ${{ secrets.MOTIVE_AI_DRIVER_PASSWORD }}
          MOTIVE_AI_VEHICLE_ID: ${{ secrets.MOTIVE_AI_VEHICLE_ID }}
          MOTIVE_AI_ELD_DEVICE_ID: ${{ secrets.MOTIVE_AI_ELD_DEVICE_ID }}
          MOTIVE_AI_ELD_IDENTIFIER: ${{ secrets.MOTIVE_AI_ELD_IDENTIFIER }}
          MOTIVE_CAMERA_SERIALNUMBER: ${{ secrets.MOTIVE_CAMERA_SERIALNUMBER }}
          MOTIVE_SAFETY1_VEHICLE_ID: ${{ secrets.MOTIVE_SAFETY1_VEHICLE_ID }}
          MOTIVE_SAFETY1_DRIVER_ID: ${{ secrets.MOTIVE_SAFETY1_DRIVER_ID }}
          MOTIVE_SAFETY1_DRIVER_EMAIL: ${{ secrets.MOTIVE_SAFETY1_DRIVER_EMAIL }}
          MOTIVE_SAFETY1_DRIVER_PASSWORD: ${{ secrets.MOTIVE_SAFETY1_DRIVER_PASSWORD }}
          MOTIVE_SAFETY2_VEHICLE_ID: ${{ secrets.MOTIVE_SAFETY2_VEHICLE_ID }}
          MOTIVE_SAFETY2_ELD_DEVICE_ID: ${{ secrets.MOTIVE_SAFETY2_ELD_DEVICE_ID }}
          MOTIVE_SAFETY2_ELD_IDENTIFIER: ${{ secrets.MOTIVE_SAFETY2_ELD_IDENTIFIER }}
          MOTIVE_SAFETY2_DRIVER_ID: ${{ secrets.MOTIVE_SAFETY2_DRIVER_ID }}
          MOTIVE_SAFETY2_DRIVER_EMAIL_ID: ${{ secrets.MOTIVE_SAFETY2_DRIVER_EMAIL_ID }}
          MOTIVE_SAFETY2_DRIVER_PASSWORD: ${{ secrets.MOTIVE_SAFETY2_DRIVER_PASSWORD }}
        run: |
          export FRAMEWORK_DIR="${GITHUB_WORKSPACE}/framework"
          export PROJECT_DIR="${FRAMEWORK_DIR}"
          runner-code/scripts/generate_framework_env.sh

      - name: Validate required framework env values
        env:
          MOTIVE_ADMIN_EMAIL: ${{ secrets.MOTIVE_ADMIN_EMAIL }}
          MOTIVE_ADMIN_PASSWORD: ${{ secrets.MOTIVE_ADMIN_PASSWORD }}
          MOTIVE_WEBUSERNAMEPASSWORD: ${{ secrets.MOTIVE_WEBUSERNAMEPASSWORD }}
          MOTIVE_ELDAPIKEY_STAGING: ${{ secrets.MOTIVE_ELDAPIKEY_STAGING }}
          MOTIVE_MOBILEAPIAUTHORIZATIONKEY: ${{ secrets.MOTIVE_MOBILEAPIAUTHORIZATIONKEY }}
          MOTIVE_TESTING_API_KEY_STAGING: ${{ secrets.MOTIVE_TESTING_API_KEY_STAGING }}
          MOTIVE_INTERNAL_API_KEY_STAGING: ${{ secrets.MOTIVE_INTERNAL_API_KEY_STAGING }}
          MOTIVE_AI_ELD_IDENTIFIER: ${{ secrets.MOTIVE_AI_ELD_IDENTIFIER }}
          MOTIVE_SAFETY1_VEHICLE_ID: ${{ secrets.MOTIVE_SAFETY1_VEHICLE_ID }}
        run: |
          missing=0
          if [[ -z "${MOTIVE_ADMIN_EMAIL}" ]]; then
            echo "Missing required secret: MOTIVE_ADMIN_EMAIL"
            missing=1
          fi
          if [[ -z "${MOTIVE_ADMIN_PASSWORD}" ]]; then
            echo "Missing required secret: MOTIVE_ADMIN_PASSWORD"
            missing=1
          fi
          if [[ -z "${MOTIVE_WEBUSERNAMEPASSWORD}" ]]; then
            echo "Missing required secret: MOTIVE_WEBUSERNAMEPASSWORD"
            missing=1
          fi
          if [[ -z "${MOTIVE_ELDAPIKEY_STAGING}" ]]; then
            echo "Missing required secret: MOTIVE_ELDAPIKEY_STAGING"
            missing=1
          fi
          if [[ -z "${MOTIVE_MOBILEAPIAUTHORIZATIONKEY}" ]]; then
            echo "Missing required secret: MOTIVE_MOBILEAPIAUTHORIZATIONKEY"
            missing=1
          fi
          if [[ -z "${MOTIVE_TESTING_API_KEY_STAGING}" ]]; then
            echo "Missing required secret: MOTIVE_TESTING_API_KEY_STAGING"
            missing=1
          fi
          if [[ -z "${MOTIVE_INTERNAL_API_KEY_STAGING}" ]]; then
            echo "Missing required secret: MOTIVE_INTERNAL_API_KEY_STAGING"
            missing=1
          fi
          if [[ -z "${MOTIVE_AI_ELD_IDENTIFIER}" ]]; then
            echo "Missing required secret: MOTIVE_AI_ELD_IDENTIFIER"
            missing=1
          fi
          if [[ -z "${MOTIVE_SAFETY1_VEHICLE_ID}" ]]; then
            echo "Missing required secret: MOTIVE_SAFETY1_VEHICLE_ID"
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            echo "Framework suite cannot run until the required secrets are configured in this repo/environment."
            exit 1
          fi

      - name: Install SDKMAN and project env
        if: ${{ env.EXECUTION_RUNTIME == 'host' }}
        run: |
          cd framework
          install_sdkman_env

      - name: Setup Gradle
        if: ${{ env.EXECUTION_RUNTIME == 'host' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Make Framework Scripts Executable
        if: ${{ env.EXECUTION_RUNTIME == 'host' }}
        run: |
          chmod +x ${{ github.workspace }}/framework/gradlew

      - name: Install dependencies
        if: ${{ env.EXECUTION_RUNTIME == 'host' }}
        run: |
          cd runner-code
          pip install -r requirements.txt

      - name: Run automation runner
        if: ${{ env.EXECUTION_RUNTIME == 'host' }}
        run: |
          cd runner-code
          python runner.py "${{ github.event.inputs.environment || 'staging' }}" "${SELECTED_SUITE}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          AWS_REGION: us-east-1
          PROJECT_DIR: ${{ github.workspace }}/framework
          SELECTED_SUITE: ${{ matrix.target }}

      - name: Run automation runner in Docker
        if: ${{ env.EXECUTION_RUNTIME == 'docker' }}
        env:
          RUNNER_IMAGE: automation-runner:test-runtime
          TARGET_SUITE: ${{ matrix.target }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          MOTIVE_ADMIN_EMAIL: ${{ secrets.MOTIVE_ADMIN_EMAIL }}
          MOTIVE_ADMIN_PASSWORD: ${{ secrets.MOTIVE_ADMIN_PASSWORD }}
          MOTIVE_WEBUSERNAMEPASSWORD: ${{ secrets.MOTIVE_WEBUSERNAMEPASSWORD }}
          MOTIVE_DRIVER_EMAIL: ${{ secrets.MOTIVE_DRIVER_EMAIL }}
          MOTIVE_DRIVER_PASSWORD: ${{ secrets.MOTIVE_DRIVER_PASSWORD }}
          MOTIVE_ADMIN_CONSOLE_EMAIL: ${{ secrets.MOTIVE_ADMIN_CONSOLE_EMAIL }}
          MOTIVE_ADMIN_CONSOLE_PASSWORD: ${{ secrets.MOTIVE_ADMIN_CONSOLE_PASSWORD }}
          MOTIVE_ELDAPIKEY_STAGING: ${{ secrets.MOTIVE_ELDAPIKEY_STAGING }}
          MOTIVE_MOBILEAPIAUTHORIZATIONKEY: ${{ secrets.MOTIVE_MOBILEAPIAUTHORIZATIONKEY }}
          MOTIVE_TESTING_API_KEY_STAGING: ${{ secrets.MOTIVE_TESTING_API_KEY_STAGING }}
          MOTIVE_INTERNAL_API_KEY_STAGING: ${{ secrets.MOTIVE_INTERNAL_API_KEY_STAGING }}
          MOTIVE_AI_DRIVER_EMAIL_ID: ${{ secrets.MOTIVE_AI_DRIVER_EMAIL_ID }}
          MOTIVE_AI_DRIVER_PASSWORD: ${{ secrets.MOTIVE_AI_DRIVER_PASSWORD }}
          MOTIVE_AI_VEHICLE_ID: ${{ secrets.MOTIVE_AI_VEHICLE_ID }}
          MOTIVE_AI_ELD_DEVICE_ID: ${{ secrets.MOTIVE_AI_ELD_DEVICE_ID }}
          MOTIVE_AI_ELD_IDENTIFIER: ${{ secrets.MOTIVE_AI_ELD_IDENTIFIER }}
          MOTIVE_CAMERA_SERIALNUMBER: ${{ secrets.MOTIVE_CAMERA_SERIALNUMBER }}
          MOTIVE_SAFETY1_VEHICLE_ID: ${{ secrets.MOTIVE_SAFETY1_VEHICLE_ID }}
          MOTIVE_SAFETY1_DRIVER_ID: ${{ secrets.MOTIVE_SAFETY1_DRIVER_ID }}
          MOTIVE_SAFETY1_DRIVER_EMAIL: ${{ secrets.MOTIVE_SAFETY1_DRIVER_EMAIL }}
          MOTIVE_SAFETY1_DRIVER_PASSWORD: ${{ secrets.MOTIVE_SAFETY1_DRIVER_PASSWORD }}
          MOTIVE_SAFETY2_VEHICLE_ID: ${{ secrets.MOTIVE_SAFETY2_VEHICLE_ID }}
          MOTIVE_SAFETY2_ELD_DEVICE_ID: ${{ secrets.MOTIVE_SAFETY2_ELD_DEVICE_ID }}
          MOTIVE_SAFETY2_ELD_IDENTIFIER: ${{ secrets.MOTIVE_SAFETY2_ELD_IDENTIFIER }}
          MOTIVE_SAFETY2_DRIVER_ID: ${{ secrets.MOTIVE_SAFETY2_DRIVER_ID }}
          MOTIVE_SAFETY2_DRIVER_EMAIL_ID: ${{ secrets.MOTIVE_SAFETY2_DRIVER_EMAIL_ID }}
          MOTIVE_SAFETY2_DRIVER_PASSWORD: ${{ secrets.MOTIVE_SAFETY2_DRIVER_PASSWORD }}
        run: |
          bash runner-code/scripts/run_in_docker.sh

      - name: Upload reports on s3
        if: ${{ always() && env.EXECUTION_RUNTIME == 'host' }}
        run: |
          report_id=$(date +%s)
          upload_intellij_xml_report "$report_id" "api"
          upload_api_usage_log "$report_id"
          generate_and_upload_allure_report "$report_id" "api"
