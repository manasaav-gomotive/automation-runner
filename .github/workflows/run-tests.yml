name: Automation Runner

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
      suite:
        description: Gradle test class or pattern passed to --tests
        required: true
        default: SafetySettings
  push:
    branches: [ main, automation_runner ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Framework Repo
        uses: actions/checkout@v4
        with:
          repository: KeepTruckin/motive-testing-automationframework
          token: ${{ secrets.GH_PAT }}
          path: framework

      - name: Checkout Runner (This Repo)
        uses: actions/checkout@v4
        with:
          path: runner-code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Framework Scripts Executable
        run: |
          chmod +x ${{ github.workspace }}/framework/gradlew

      - name: Install dependencies
        run: |
          cd runner-code
          pip install -r requirements.txt

      - name: Run automation runner
        run: |
          cd runner-code
          python runner.py "${{ github.event.inputs.environment || 'staging' }}" "${{ github.event.inputs.suite || 'safety.settings' }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROJECT_DIR: ${{ github.workspace }}/framework
