name: Build Test Runner Image
run-name: "build-test-runner-image-${{ github.event.inputs.image_tag || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or ref to build from
        required: true
        default: automation_runner
      framework_ref:
        description: Framework branch or ref to bake into the image
        required: true
        default: master
      image_tag:
        description: Optional image tag override
        required: false
        default: ""
      artifact_branch:
        description: Branch that stores the latest Docker tarball
        required: true
        default: docker-latest

permissions:
  contents: write

jobs:
  build-and-publish-tar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Runner (This Repo)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || 'automation_runner' }}

      - name: Compute image metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::12}"
          branch_slug=$(echo "${{ github.event.inputs.branch || 'automation_runner' }}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._/-]#-#g' | sed 's#/#-#g')
          requested_tag="${{ github.event.inputs.image_tag }}"
          if [[ -n "${requested_tag}" ]]; then
            image_tag="${requested_tag}"
          else
            image_tag="${branch_slug}-${short_sha}"
          fi
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Build test-runner image
        run: |
          docker build \
            --build-arg GH_PAT="${{ secrets.GH_PAT }}" \
            --build-arg FRAMEWORK_REF="${{ github.event.inputs.framework_ref || 'master' }}" \
            -t "automation-runner:${{ steps.meta.outputs.image_tag }}" \
            .

      - name: Save and compress image tarball
        run: |
          docker save "automation-runner:${{ steps.meta.outputs.image_tag }}" | gzip -c > /tmp/automation-runner-image.tar.gz

      - name: Write image manifest
        run: |
          cat > /tmp/manifest.json <<EOF
          {
            "image_tag": "${{ steps.meta.outputs.image_tag }}",
            "source_branch": "${{ github.event.inputs.branch || 'automation_runner' }}",
            "framework_ref": "${{ github.event.inputs.framework_ref || 'master' }}",
            "artifact_branch": "${{ github.event.inputs.artifact_branch || 'docker-latest' }}",
            "commit_sha": "${GITHUB_SHA}",
            "created_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Publish tarball to artifact branch
        env:
          ARTIFACT_BRANCH: ${{ github.event.inputs.artifact_branch || 'docker-latest' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          cp /tmp/automation-runner-image.tar.gz "${publish_dir}/automation-runner-image.tar.gz"
          cp /tmp/manifest.json "${publish_dir}/manifest.json"
          cat > "${publish_dir}/README.md" <<EOF
          # Docker Image Artifact Branch

          This branch is force-updated by GitHub Actions and stores the latest Docker image tarball for the test runner workflow.
          EOF

          cd "${publish_dir}"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "${ARTIFACT_BRANCH}"
          git add automation-runner-image.tar.gz manifest.json README.md
          git commit -m "Update docker image tarball (${GITHUB_SHA::12})"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:"${ARTIFACT_BRANCH}"

      - name: Print artifact summary
        run: |
          echo "Published branch: ${{ github.event.inputs.artifact_branch || 'docker-latest' }}"
          echo "Image tag: ${{ steps.meta.outputs.image_tag }}"
          echo "Tarball: automation-runner-image.tar.gz"
