name: Build Test Runner Image
run-name: "build-test-runner-image-${{ github.event.inputs.image_tag || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or ref to build from
        required: true
        default: automation_runner
      framework_ref:
        description: Framework branch or ref to bake into the image
        required: true
        default: master
      image_tag:
        description: Optional image tag override
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'automation-runner-test-runtime' }}
    steps:
      - name: Checkout Runner (This Repo)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || 'automation_runner' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${ECR_REPOSITORY}" >/dev/null

      - name: Compute image tags
        id: meta
        run: |
          short_sha="${GITHUB_SHA::12}"
          branch_slug=$(echo "${{ github.event.inputs.branch || 'automation_runner' }}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._/-]#-#g' | sed 's#/#-#g')
          requested_tag="${{ github.event.inputs.image_tag }}"
          if [[ -n "${requested_tag}" ]]; then
            image_tag="${requested_tag}"
          else
            image_tag="${branch_slug}-${short_sha}"
          fi
          registry="${{ steps.login-ecr.outputs.registry }}"
          image_uri="${registry}/${ECR_REPOSITORY}:${image_tag}"
          latest_uri="${registry}/${ECR_REPOSITORY}:latest"
          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"
          echo "latest_uri=${latest_uri}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build \
            --build-arg GH_PAT="${{ secrets.GH_PAT }}" \
            --build-arg FRAMEWORK_REF="${{ github.event.inputs.framework_ref || 'master' }}" \
            -t "${{ steps.meta.outputs.image_uri }}" \
            -t "${{ steps.meta.outputs.latest_uri }}" \
            .
          docker push "${{ steps.meta.outputs.image_uri }}"
          docker push "${{ steps.meta.outputs.latest_uri }}"

      - name: Print image summary
        run: |
          echo "Pushed image: ${{ steps.meta.outputs.image_uri }}"
          echo "Updated latest: ${{ steps.meta.outputs.latest_uri }}"
